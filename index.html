<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Cyberpunk Radio Switch</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      font-family: 'Segoe UI', sans-serif;
    }

    .radio-input {
      display: flex;
      gap: 2px;
      padding: 5px;
      border-radius: 12px;
      background: #222;
    }

    .radio-input input {
      display: none;
    }

    .radio-input .label {
      position: relative;
      width: 100px;
      height: 60px;
      background: linear-gradient(to bottom, #333, #222);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0px 8px 5px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .label:first-child {
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }
    .label:last-child {
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .label .text {
      font-size: 16px;
      font-weight: 700;
      color: #ccc;
      text-transform: uppercase;
      transition: all 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      z-index: 2;
      position: relative;
    }

    .label:has(input[type="radio"]:checked) {
      background: linear-gradient(145deg, #00ffff, #00ffff, #00ffff, #00f);
      box-shadow: 
        0 0 15px #00ffff,    
        0 0 30px rgba(0,255,255,0.5),   
        0 0 45px rgba(0,255,255,0.2); 
    }

    .label:has(input[type="radio"]:checked) .text {
      color: #000;
      text-shadow:
        0 0 8px #00ffff,
        0 0 12px rgba(0,255,255,0.5),
        0 0 20px rgba(0,255,255,0.2);
    }

    .label:hover {
      transform: scale(1.05);
      box-shadow: 
        0 0 10px rgba(0,255,255,0.5), 
        0 5px 15px rgba(0,255,255,0.3);
    }

    .label:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(0,255,255,0.2) inset;
    }

    .label::after {
      content: '';
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: rgba(255,255,255,0.2);
      transform: skewX(-25deg);
      transition: all 0.3s ease;
    }

    .label:hover::after {
      left: 150%;
      transition: left 0.5s ease-in-out;
    }

    .label span.spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ffff;
      opacity: 0.7;
      animation: sparkMove 2s infinite;
      z-index: 1; 
    }

    .label span.spark:nth-child(1) { top: 10%; left: 15%; animation-delay: 0s; }
    .label span.spark:nth-child(2) { top: 20%; left: 70%; animation-delay: 0.5s; }
    .label span.spark:nth-child(3) { bottom: 10%; left: 40%; animation-delay: 1s; }

    @keyframes sparkMove {
      0% { transform: translate(0,0) scale(0.5); opacity:0.5; }
      50% { transform: translate(10px,5px) scale(1.2); opacity:1; }
      100% { transform: translate(0,0) scale(0.5); opacity:0.5; }
    }
  </style>
</head>
<body>
  <div class="radio-input">
    <label class="label">
      <input type="radio" name="value-radio"/>
      <span class="text">Play</span>
      <span class="spark"></span>
      <span class="spark"></span>
    </label>
    <label class="label">
      <input type="radio" name="value-radio"/>
      <span class="text">Stop</span>
      <span class="spark"></span>
      <span class="spark"></span>
    </label>
    <label class="label">
      <input type="radio" name="value-radio"/>
      <span class="text">Reset</span>
      <span class="spark"></span>
      <span class="spark"></span>
    </label>
  </div>
</body>
</html>
